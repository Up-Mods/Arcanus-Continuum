[versions]
fabric_loom = "1.17.19"

minecraft = "26.1.2"
fabric_loader = "0.19.3"

# environment stuff
jetbrains_annotations = "26.0.1"
autoservice = "1.1.1"

# misc
yeetus_experimentus_fabric = "Zp3lJWyj" # [FABRIC][26.1.2] YeetusExperimentus 99.0.0

# required dependencies
fabric_api = "0.155.2+26.1.2"
cca = "8.0.1"
sparkweave = "0.600.0-alpha.12"
resourceful_config = "4.0.1"
common_network = "1.0.23-26.1.2"
datasync = "0.10.0"

# added compat
modmenu = "18.0.0"
firstperson = "PBg45FeB" # 2.7.2
lambdynamiclights = "4.11.1+26.1.2"
explosive_enhancement = "1.4.2-26.1.1"
sodium = "mc26.1.2-0.9.2-alpha.4-fabric"
iris = "1.11.3+26.1-fabric"

[libraries]
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
fabric_loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric_loader" }
jetbrains_annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains_annotations" }
autoservice = { module = "com.google.auto.service:auto-service", version.ref = "autoservice" }
autoservice_annotations = { module = "com.google.auto.service:auto-service-annotations", version.ref = "autoservice" }

fabric_api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric_api" }
cca_base = { module = "dev.onyxstudios.cardinal-components-api:cardinal-components-base", version.ref = "cca" }
cca_block = { module = "dev.onyxstudios.cardinal-components-api:cardinal-components-block", version.ref = "cca" }
cca_chunk = { module = "dev.onyxstudios.cardinal-components-api:cardinal-components-chunk", version.ref = "cca" }
cca_entity = { module = "dev.onyxstudios.cardinal-components-api:cardinal-components-entity", version.ref = "cca" }
cca_scoreboard = { module = "dev.onyxstudios.cardinal-components-api:cardinal-components-scoreboard", version.ref = "cca" }
sparkweave = { module = "dev.upcraft.sparkweave:Sparkweave-Fabric", version.ref = "sparkweave" }
datasync_fabric = { module = "dev.upcraft.datasync:datasync-minecraft-1.21.1-fabric", version.ref = "datasync" }
resourceful_config = { module = "com.teamresourceful.resourcefulconfig:resourcefulconfig-fabric-1.21", version.ref = "resourceful_config" }
common_network_fabric = { module = "mysticdrew:common-networking-fabric", version.ref = "common_network" }

modmenu = { module = "com.terraformersmc:modmenu", version.ref = "modmenu" }
firstperson = { module = "maven.modrinth:first-person-model", version.ref = "firstperson" }
lambdynamiclights = { module = "dev.lambdaurora.lambdynamiclights:lambdynamiclights-api", version.ref = "lambdynamiclights" }
explosive_enhancement = { module = "maven.modrinth:explosive-enhancement", version.ref = "explosive_enhancement" }
sodium = { module = "maven.modrinth:sodium", version.ref = "sodium" }
iris = { module = "maven.modrinth:iris", version.ref = "iris" }

yeetus_experimentus_fabric = { module = "maven.modrinth:yeetus-experimentus", version.ref = "yeetus_experimentus_fabric" }

# If you have multiple similar dependencies, you can declare a dependency bundle and reference it on the build script with "libs.bundles.example".
[bundles]
cca = ["cca_base", "cca_block", "cca_chunk", "cca_entity", "cca_scoreboard"]

[plugins]
fabric_loom = { id = "fabric-loom", version.ref = "fabric_loom" }
